  <title>Campus Nova</title>
<script>
  (() => {
    try {
      const savedTheme = localStorage.getItem('nova-theme');

      if (
        savedTheme === 'light' ||
        savedTheme === 'dark'
      ) {
        document.documentElement.dataset.theme = savedTheme;
        document.documentElement.style.colorScheme = savedTheme;
      }
    } catch {}
  })();
</script>
