<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Campus Nova</title>
  <desc id="desc">Stylized Nova N mark</desc>
  <defs>
    <linearGradient id="bg" x1="44" y1="24" x2="468" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="0.52" stop-color="#0a1730"/>
      <stop offset="1" stop-color="#11142c"/>
    </linearGradient>
    <linearGradient id="n" x1="118" y1="116" x2="396" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55e6ff"/>
      <stop offset="0.48" stop-color="#18b7ff"/>
      <stop offset="1" stop-color="#6e63ff"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="shine" x1="150" y1="126" x2="360" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#d7f7ff" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <rect x="22" y="22" width="468" height="468" rx="116" fill="url(#bg)"/>
  <rect x="23.5" y="23.5" width="465" height="465" rx="114.5" fill="none" stroke="#77ddff" stroke-opacity="0.13" stroke-width="3"/>
  <circle cx="397" cy="116" r="82" fill="#24c7ff" opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="135" cy="394" r="96" fill="#6d63ff" opacity="0.055" filter="url(#softGlow)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M158 383V129" stroke="url(#n)" stroke-width="58"/>
    <path d="M354 129V383" stroke="url(#n)" stroke-width="58"/>
    <path d="M158 129L354 383" stroke="#9eeeff" stroke-opacity="0.18" stroke-width="66"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M158 383V129" stroke="url(#n)" stroke-width="58"/>
    <path d="M354 129V383" stroke="url(#n)" stroke-width="58"/>
    <path d="M158 129L354 383" stroke="url(#shine)" stroke-width="50"/>
  </g>

  <path d="M158 129L354 383" stroke="#ffffff" stroke-opacity="0.52" stroke-width="7" stroke-linecap="round"/>
</svg>
